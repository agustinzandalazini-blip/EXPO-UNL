<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trivia Ingeniería Industrial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&display=swap">
<style>
  :root {
    --navy: #173a5e;
    --teal: #1f8a78;
    --orange: #ef6a1f;
    --crimson: #c4233f;
    --blue: #1e5b83;
    --green: #3e8e3a;
    --paper: #fbf9f3;
    --ground: #eef0f2;
    --ink: #1c2530;
    --muted: #5f6b77;
    --line: #dcdfe3;
    --ok: #2f8a3c;
    --ok-bg: #e6f4e8;
    --bad: #c4233f;
    --bad-bg: #fbe7ea;
    --accent: var(--navy);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    padding-inline: 16px;
    padding-block: 24px;
  }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  /* Barra superior */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { font-weight: 900; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--navy); }
  .brand span { color: var(--orange); }
  .score-pill {
    font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;
    background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
  }
  .progress { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .progress i { display: block; height: 8px; border-radius: 4px; background: var(--line); transition: background .3s; }
  .progress i.ok { background: var(--ok); }
  .progress i.bad { background: var(--bad); }
  .progress i.now { background: var(--accent); }

  /* Tarjeta de pregunta, igual que las tarjetas impresas */
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; box-shadow: 0 8px 24px rgba(23,58,94,.08); }
  .card-head {
    background: var(--accent); color: #fff;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding: 22px 24px;
  }
  .card-head h2 { margin: 0; font-size: clamp(18px, 3.4vw, 23px); font-weight: 800; line-height: 1.25; text-wrap: balance; }
  .card-head .num { font-weight: 900; font-size: clamp(26px, 5vw, 36px); line-height: 1; font-variant-numeric: tabular-nums; }
  .card-body { padding: 24px; display: flex; flex-direction: column; gap: 12px; }

  .opt {
    display: flex; align-items: flex-start; gap: 14px; width: 100%;
    text-align: left; font: inherit; color: var(--ink);
    background: #fff; border: 2px solid var(--line); border-radius: 6px;
    padding: 14px 16px; cursor: pointer; transition: border-color .15s, background .15s, transform .1s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:active:not(:disabled) { transform: scale(.99); }
  .opt:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  .opt:disabled { cursor: default; }
  .opt .letter {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--line); display: grid; place-items: center;
    font-weight: 800; font-size: 14px; text-transform: uppercase; color: var(--muted);
  }
  .opt.correct { border-color: var(--ok); background: var(--ok-bg); }
  .opt.correct .letter { border-color: var(--ok); background: var(--ok); color: #fff; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt.wrong .letter { border-color: var(--bad); background: var(--bad); color: #fff; }
  .opt.dim { opacity: .55; }

  /* Cartel de respuesta */
  .banner { border-radius: 6px; padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start; animation: pop .35s ease-out; }
  .banner.ok { background: var(--ok); color: #fff; }
  .banner.bad { background: #fff; border: 2px solid var(--bad); color: var(--ink); }
  .banner .icon { flex: none; font-size: 30px; line-height: 1; }
  .banner h3 { margin: 0 0 4px; font-size: 20px; font-weight: 900; }
  .banner.bad h3 { color: var(--bad); }
  .banner p { margin: 0; }
  .banner .why { margin-top: 8px; }
  .banner.ok .why { opacity: .95; }

  .next {
    align-self: flex-end; font: inherit; font-weight: 800; font-size: 16px;
    background: var(--navy); color: #fff; border: 0; border-radius: 6px;
    padding: 14px 26px; cursor: pointer;
  }
  .next:hover { background: #0f2944; }
  .next:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

  /* Pantallas de inicio y resultado */
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 32px 24px; display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
  .panel h1 { margin: 0; font-size: clamp(28px, 6vw, 42px); font-weight: 900; line-height: 1.05; color: var(--navy); text-wrap: balance; }
  .panel p { margin: 0; max-width: 60ch; color: var(--muted); }
  .stripes { display: flex; gap: 6px; }
  .stripes i { width: 34px; height: 10px; border-radius: 2px; }

  .grade { display: flex; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; }
  .grade .big { font-size: clamp(64px, 16vw, 110px); font-weight: 900; line-height: .9; }
  .grade .of { font-size: 22px; font-weight: 700; color: var(--muted); }
  .grade-label { font-size: 22px; font-weight: 900; }
  .review { width: 100%; display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .review li { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; font-size: 14px; }
  .review .mark { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 13px; }
  .review .mark.ok { background: var(--ok); }
  .review .mark.bad { background: var(--bad); }
  .review .n { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); }

  /* Confeti */
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .banner { animation: none; }
    .progress i, .opt { transition: none; }
  }
  @media (max-width: 480px) {
    .card-head, .card-body { padding: 18px; }
  }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<main class="wrap" id="app"></main>

<script>
const COLORS = ["#173a5e", "#1f8a78", "#ef6a1f", "#1e5b83", "#c4233f", "#3e8e3a", "#173a5e", "#1f8a78", "#ef6a1f", "#1e5b83"];

const QUESTIONS = [
  {
    q: "¿Cuál es el objetivo principal de los y las profesionales de la ingeniería industrial?",
    opts: ["Programar aplicaciones móviles", "Diseñar edificios y estructuras", "Optimizar procesos y gestionar recursos para mejorar la producción"],
    ans: 2,
    why: "La ingeniería industrial busca que los procesos funcionen mejor: menos desperdicio, mejor uso de personas, máquinas, materiales y tiempo. Programar apps es tarea de la informática y diseñar edificios, de la arquitectura y la ingeniería civil."
  },
  {
    q: "¿Qué estudia la Logística dentro de la Ingeniería Industrial?",
    opts: ["El análisis de datos", "El movimiento y almacenamiento eficiente de materiales y productos", "Los costos de producción"],
    ans: 1,
    why: "La logística se ocupa de que los materiales y productos lleguen al lugar correcto, en el momento justo y al menor costo: transporte, depósitos, inventarios y distribución. El análisis de datos y los costos son herramientas que usa, pero no son su objeto de estudio."
  },
  {
    q: "¿Por qué se dice que la ingeniería industrial es una ingeniería orientada a la gestión?",
    opts: ["Porque tiene la capacidad de analizar el proceso en su totalidad de manera conjunta, gestionando recursos para dar soluciones.", "Porque se enfoca de manera individual en cada actividad que compone un proceso, analizándolas por separado sin tener en cuenta su vinculación.", "Porque gestiona solo personal y materias primas."],
    ans: 0,
    why: "Gestionar es mirar el sistema completo: cómo se conectan las actividades entre sí y cómo se combinan todos los recursos. Mejorar cada parte por separado, sin ver el conjunto, suele trasladar el problema a otro sector."
  },
  {
    q: "¿Dónde se desempeñan los y las profesionales de ingeniería industrial?",
    opts: ["Exclusivamente en fábricas e industrias.", "Exclusivamente en el sector privado.", "Puede desempeñarse en cualquier sector, siempre que haya un proceso que implique un agregado de valor para obtener un producto final."],
    ans: 2,
    why: "Donde hay un proceso que transforma algo y agrega valor, hay lugar para un/a ingeniero/a industrial: hospitales, bancos, supermercados, organismos públicos, empresas de servicios y, por supuesto, fábricas."
  },
  {
    q: "¿Cuál de estas afirmaciones se aplica a los y las profesionales de ingeniería industrial?",
    opts: ["Trabaja de forma aislada, tomando decisiones.", "Solo se comunica con el área de producción.", "Su campo laboral es muy amplio, desempeñándose en distintos puestos tanto del sector público como privado."],
    ans: 2,
    why: "Puede trabajar en producción, calidad, logística, compras, costos, seguridad, proyectos o consultoría, en empresas privadas y en el Estado. Y siempre en equipo, vinculando distintas áreas."
  },
  {
    q: "¿Por qué muchas empresas demandan ingenieros/as industriales?",
    opts: ["Porque son especialistas en máquinas para la industria.", "Porque son versátiles y optimizan procesos gestionando recursos.", "Porque se desempeñan solo en el área de producción."],
    ans: 1,
    why: "Su valor está en la versatilidad: pueden moverse entre áreas y mejorar cualquier proceso. El diseño de máquinas es más propio de la ingeniería mecánica."
  },
  {
    q: "¿Cuáles son las herramientas clave de trabajo de un profesional de la ingeniería industrial?",
    opts: ["Exclusivamente herramientas de diseño gráfico y paquete de Office.", "Habilidades blandas, software de gestión, paquete de Office y herramientas de análisis de datos.", "Exclusivamente herramientas de programación."],
    ans: 1,
    why: "Se combinan herramientas técnicas (planillas, software de gestión, análisis de datos) con habilidades blandas para comunicar, negociar y liderar. Las opciones con \"exclusivamente\" dejan afuera buena parte del trabajo."
  },
  {
    q: "¿Quiénes pueden estudiar Ingeniería Industrial?",
    opts: ["Exclusivamente personas con habilidades para la administración de empresas e industrias.", "Personas con capacidad analítica y curiosidad por cómo funcionan las cosas.", "Exclusivamente personas con conocimientos de escuelas técnicas."],
    ans: 1,
    why: "No hace falta venir de una escuela técnica ni saber de administración: la carrera enseña todo eso. Lo que más ayuda es la curiosidad y las ganas de analizar y resolver problemas."
  },
  {
    q: "¿Cuál es una característica clave del perfil de un/a ingeniero/a industrial?",
    opts: ["Habilidades blandas para comunicar ideas y liderar equipos.", "Trabajar exclusivamente en tareas manuales.", "Desempeñarse de manera independiente."],
    ans: 0,
    why: "Como coordina personas y áreas, necesita comunicar bien, escuchar y liderar equipos. Es un trabajo intelectual y colaborativo, no manual ni solitario."
  },
  {
    q: "¿Cuántos años de cursado tiene la carrera de Ingeniería Industrial en UTN FRSF según el plan de estudios?",
    opts: ["5", "4", "6"],
    ans: 0,
    why: "Según el plan de estudios, Ingeniería Industrial en la UTN Facultad Regional Santa Fe se cursa en 5 años."
  }
];

const CHEERS = ["¡Excelente!", "¡Muy bien!", "¡Correcto!", "¡Genial!", "¡Bien ahí!", "¡Impecable!"];
const LETTERS = ["a", "b", "c"];
const app = document.getElementById("app");

let current = 0;
let results = [];

function progressBar() {
  return `<div class="progress" aria-hidden="true">${QUESTIONS.map((_, i) => {
    const cls = results[i] === true ? "ok" : results[i] === false ? "bad" : i === current ? "now" : "";
    return `<i class="${cls}"></i>`;
  }).join("")}</div>`;
}

function topBar() {
  const correct = results.filter(Boolean).length;
  return `<div class="top">
    <div class="brand">Ingeniería <span>Industrial</span> · Trivia</div>
    <div class="score-pill">Aciertos: ${correct} / ${results.length}</div>
  </div>`;
}

function renderStart() {
  document.documentElement.style.setProperty("--accent", COLORS[0]);
  app.innerHTML = `
    <section class="panel">
      <div class="stripes">${["#173a5e","#1f8a78","#ef6a1f","#c4233f","#3e8e3a"].map(c => `<i style="background:${c}"></i>`).join("")}</div>
      <h1>¿Cuánto sabés de Ingeniería Industrial?</h1>
      <p>10 preguntas sobre qué hace un/a ingeniero/a industrial, dónde trabaja y cómo es la carrera en la UTN FRSF. Elegí una opción en cada pregunta y al final vas a ver tu calificación.</p>
      <button class="next" id="start">Empezar</button>
    </section>`;
  document.getElementById("start").onclick = () => { current = 0; results = []; renderQuestion(); };
  document.getElementById("start").focus();
}

function renderQuestion() {
  const item = QUESTIONS[current];
  document.documentElement.style.setProperty("--accent", COLORS[current]);
  app.innerHTML = `
    ${topBar()}
    ${progressBar()}
    <article class="card">
      <header class="card-head">
        <h2>${item.q}</h2>
        <span class="num">${String(current + 1).padStart(2, "0")}</span>
      </header>
      <div class="card-body">
        ${item.opts.map((o, i) => `
          <button class="opt" data-i="${i}" id="opt-${i}">
            <span class="letter">${LETTERS[i]}</span><span>${o}</span>
          </button>`).join("")}
        <div id="feedback"></div>
      </div>
    </article>`;
  app.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => answer(+btn.dataset.i)));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function answer(choice) {
  const item = QUESTIONS[current];
  const ok = choice === item.ans;
  results[current] = ok;

  app.querySelectorAll(".opt").forEach((btn, i) => {
    btn.disabled = true;
    if (i === item.ans) btn.classList.add("correct");
    else if (i === choice) btn.classList.add("wrong");
    else btn.classList.add("dim");
  });

  const correctText = `<strong>${LETTERS[item.ans].toUpperCase()})</strong> ${item.opts[item.ans]}`;
  const fb = document.getElementById("feedback");
  fb.innerHTML = ok
    ? `<div class="banner ok" role="status">
         <div class="icon">🎉</div>
         <div><h3>${CHEERS[Math.floor(Math.random() * CHEERS.length)]} ¡Felicitaciones!</h3>
         <p class="why">${item.why}</p></div>
       </div>`
    : `<div class="banner bad" role="status">
         <div class="icon">✗</div>
         <div><h3>Incorrecto</h3>
         <p>La respuesta correcta es ${correctText}</p>
         <p class="why"><strong>¿Por qué?</strong> ${item.why}</p></div>
       </div>`;

  const last = current === QUESTIONS.length - 1;
  const next = document.createElement("button");
  next.className = "next";
  next.textContent = last ? "Ver mi calificación" : "Siguiente pregunta →";
  next.onclick = () => { if (last) renderResult(); else { current++; renderQuestion(); } };
  fb.appendChild(next);
  fb.style.display = "flex"; fb.style.flexDirection = "column"; fb.style.gap = "12px";

  // actualizar barra y contador
  app.querySelector(".top").outerHTML = topBar();
  app.querySelector(".progress").outerHTML = progressBar();

  if (ok) confetti(80);
  next.focus({ preventScroll: true });
  fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function gradeFor(n) {
  if (n === 10) return { label: "¡Perfecto! Tenés alma de ingeniero/a industrial", color: "#2f8a3c", text: "Respondiste todo bien. Conocés muy bien la carrera y la profesión." };
  if (n >= 8)  return { label: "Muy bien", color: "#1f8a78", text: "Tenés muy claro de qué se trata la ingeniería industrial. ¡Te falta poquito para el 10!" };
  if (n >= 6)  return { label: "Aprobado", color: "#1e5b83", text: "Conocés lo principal de la carrera. Repasá las preguntas que fallaste para completar la idea." };
  if (n >= 4)  return { label: "Casi…", color: "#ef6a1f", text: "Tenés algunas ideas, pero hay varias cosas por descubrir. ¡Acercate al stand y preguntanos!" };
  return { label: "A seguir explorando", color: "#c4233f", text: "Todavía hay mucho por conocer de la ingeniería industrial. ¡Es un buen momento para empezar a descubrirla!" };
}

function renderResult() {
  const n = results.filter(Boolean).length;
  const g = gradeFor(n);
  document.documentElement.style.setProperty("--accent", g.color);
  app.innerHTML = `
    ${progressBar()}
    <section class="panel">
      <div class="grade-label" style="color:${g.color}">${g.label}</div>
      <div class="grade"><span class="big" style="color:${g.color}">${n}</span><span class="of">/ 10</span></div>
      <p>${g.text}</p>
      <ul class="review">
        ${QUESTIONS.map((q, i) => `
          <li><span class="mark ${results[i] ? "ok" : "bad"}">${results[i] ? "✓" : "✗"}</span>
          <span><span class="n">${String(i + 1).padStart(2, "0")}</span> ${q.q}${results[i] ? "" : `<br><em>Correcta: ${LETTERS[q.ans].toUpperCase()}) ${q.opts[q.ans]}</em>`}</span></li>`).join("")}
      </ul>
      <button class="next" id="again">Jugar de nuevo</button>
    </section>`;
  document.getElementById("again").onclick = renderStart;
  if (n >= 6) confetti(n === 10 ? 220 : 120);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* Confeti simple en canvas */
const cv = document.getElementById("confetti");
const ctx = cv.getContext("2d");
let parts = [], raf = null;
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", resize); resize();
function confetti(count) {
  if (reduce) return;
  const pal = ["#173a5e", "#1f8a78", "#ef6a1f", "#c4233f", "#3e8e3a", "#f2c230"];
  for (let i = 0; i < count; i++) {
    parts.push({
      x: Math.random() * cv.width, y: -20 * devicePixelRatio - Math.random() * cv.height * .3,
      vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4,
      s: (5 + Math.random() * 6) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
      c: pal[i % pal.length]
    });
  }
  if (!raf) tick();
}
function tick() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.y < cv.height + 40);
  for (const p of parts) {
    p.x += p.vx * devicePixelRatio; p.y += p.vy * devicePixelRatio; p.vy += .05; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    ctx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : null;
  if (!raf) ctx.clearRect(0, 0, cv.width, cv.height);
}

renderStart();
</script>
</body>
</html>
